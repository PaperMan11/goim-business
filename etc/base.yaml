server:
  http_addr: "0.0.0.0:8080"
  probe_addr: "0.0.0.0:8081"
  metrics_addr: "0.0.0.0:9091"
  read_timeout: 15s
  write_timeout: 30s
  idle_timeout: 60s
  shutdown_timeout: 15s
  max_body_bytes: 8388608
  # 反向代理的可信网段（IP 或 CIDR）。为空表示服务直连，忽略 X-Forwarded-For / X-Real-IP。
  # 部署在 Nginx/SLB 之后时至少加入代理地址，例如 127.0.0.1、10.0.0.0/8。
  trusted_proxies: []

log:
  level: info
  format: json
  service: goim-business

mysql:
  dsn: ""
  max_open_conns: 50
  max_idle_conns: 10
  conn_max_lifetime: 30m
  conn_max_idle_time: 5m
  slow_threshold: 200ms

redis:
  addr: "127.0.0.1:6379"
  password: ""
  db: 0
  key_prefix: "goim:business"

auth:
  jwt_secret: ""
  issuer: "goim-business"
  audience: "goim-business-api"
  access_ttl: 15m
  refresh_ttl: 720h
  max_sessions_per_user: 5
  max_sessions_per_platform: 3
  login_lock_threshold: 10
  login_lock_window: 15m

ratelimit:
  enabled: true
  login_per_minute: 5
  register_per_hour: 3
  # IM token 兑换/重试的 IP 维度限流；<=0 表示关闭。
  im_token_per_minute: 30

cors:
  allowed_origins: ["*"]

# goim im-api 客户端；base_url 为空表示未接入 IM（服务仍可启动）。
im:
  base_url: ""
  # 下发给客户端的 IM HTTP / WS 地址；api_base_url 为空时回退为 base_url + /api/v1。
  api_base_url: ""
  ws_url: ""
  admin_user_id: ""
  # 只能通过环境变量 GOIM_BIZ_IM__ADMIN_SECRET 注入，禁止写入仓库。
  admin_secret: ""
  timeout: 3s
  token_refresh_ahead: 60s
  # IM 开通补偿 outbox：扫描间隔与单批处理条数，启用 IM 时必须大于 0。
  outbox_scan_interval: 60s
  outbox_batch_size: 20

# RustFS / S3 兼容对象存储；endpoint 与 bucket 同时为空表示未启用文件能力。
# 客户端直传，服务端只负责签名与元数据，不代理文件字节。
storage:
  endpoint: ""
  # 客户端直传/下载使用的对外地址（公网域名或 CDN）；为空回退 endpoint。
  public_endpoint: ""
  access_key: ""
  # 只能通过环境变量 GOIM_BIZ_STORAGE__SECRET_KEY 注入，禁止写入仓库。
  secret_key: ""
  region: "us-east-1"
  bucket: ""
  use_path_style: true
  presign_expire: 15m
  # 分片上传签名有效期；大文件弱网上传可能超过单文件签名窗口。
  multipart_presign_expire: 2h
  # 过期 pending 文件清理任务：扫描间隔与单批处理条数；<=0 时使用内置默认值（1h / 100）。
  cleanup_interval: 1h
  cleanup_batch_size: 100
