openapi: 3.0.3
info:
  title: goim-business API
  version: 1.0.0
  description: |
    goim-business 账号域、IM 凭证、用户资料、设备、客户端配置与文件直传（含分片上传）的 OpenAPI 契约，只描述当前已注册的 26 个 operation（25 条路径）。

    **统一响应约定**：除 `GET /client-config` 命中 ETag 时返回 304 外，所有接口的 HTTP 状态码恒为 200，
    业务结果一律由响应体 `code` 判断：`0` 表示成功，非 `0` 为业务错误码，错误提示见 `msg`，`data` 可能为空或携带明细。
    因此成功与业务错误共用同一个 `200` 响应，客户端不要依赖 HTTP 状态码做分支。

    **鉴权**：需要登录态的接口携带 `Authorization: Bearer <access token>`；
    `access token` 过期返回 `2004`，其余鉴权失败返回 `1002`。

    **常用错误码**：1001 参数错误、1002 未认证或登录态已失效、1029 请求过于频繁、
    2001 账号已存在、2002 账号或密码错误、2003 账号已被冻结、2004 access token 已过期、
    2005 刷新令牌已失效、2006 会话数量超出上限、9001 服务内部错误、9002 依赖服务不可用。

tags:
  - name: Account
    description: 账号注册、登录、令牌刷新、登出、会话管理、改密与注销
  - name: IM
    description: IM token 兑换、开通状态查询与手动重试
  - name: Profile
    description: 本人资料读写、公开资料批量查询与单用户查询
  - name: Device
    description: 我的设备列表与移除设备（设备随登录/注册自动登记）
  - name: ClientConfig
    description: 客户端启动配置、ETag 缓存与配置项元数据
  - name: File
    description: 文件直传签名、完成校验、访问地址与删除（客户端直传对象存储）

servers:
  - url: /biz-api/v1

paths:
  /account/register:
    post:
      tags: [Account]
      operationId: registerAccount
      summary: 注册账号
      description: |
        注册成功即签发 access token / refresh token 并创建当前会话。
        设备标识与客户端版本通过请求头传入（X-Device-Id 必填、X-Client-Version 可选），并在同一事务内登记设备。
        公开接口，受 IP 维度限流保护（默认 3 次/小时）。
        错误码：1001 参数错误、2001 账号已存在、1029 请求过于频繁、9001 服务内部错误、9002 依赖服务不可用。
      parameters:
        - $ref: '#/components/parameters/XClientPlatform'
        - $ref: '#/components/parameters/XDeviceID'
        - $ref: '#/components/parameters/XClientVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          $ref: '#/components/responses/AuthOK'

  /account/login:
    post:
      tags: [Account]
      operationId: loginAccount
      summary: 登录
      description: |
        校验账号密码，成功后签发 access token / refresh token 并创建新会话。
        设备标识与客户端版本通过请求头传入（X-Device-Id 必填、X-Client-Version 可选），登录成功会在同一事务内登记设备。
        公开接口，受 IP 维度限流保护（默认 5 次/分钟）；登录失败次数超阈值同样返回 1029。
        错误码：1001 参数错误、2002 账号或密码错误、2003 账号已被冻结、1029 请求过于频繁、
        9001 服务内部错误、9002 依赖服务不可用。
      parameters:
        - $ref: '#/components/parameters/XClientPlatform'
        - $ref: '#/components/parameters/XDeviceID'
        - $ref: '#/components/parameters/XClientVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          $ref: '#/components/responses/AuthOK'

  /account/refresh:
    post:
      tags: [Account]
      operationId: refreshToken
      summary: 刷新令牌
      description: |
        使用请求体中的 refreshToken 轮换令牌，请求体即凭证，不需要 Authorization 头。
        旧 refreshToken 被重放时会撤销整个令牌家族并返回 2005。
        错误码：1002 未认证或登录态已失效、2003 账号已被冻结、2005 刷新令牌已失效、
        9001 服务内部错误、9002 依赖服务不可用。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          $ref: '#/components/responses/AuthOK'

  /account/logout:
    post:
      tags: [Account]
      operationId: logoutAccount
      summary: 登出当前会话
      description: |
        撤销当前会话并清除 Redis 活跃标记；响应 data 为空。
        错误码：1002 未认证或登录态已失效、9001 服务内部错误、9002 依赖服务不可用。
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/EmptyOK'

  /account/sessions:
    get:
      tags: [Account]
      operationId: listSessions
      summary: 查询活跃会话
      description: |
        列出当前用户全部活跃会话，`current` 标记当前请求所在会话。
        错误码：1002 未认证或登录态已失效、9001 服务内部错误、9002 依赖服务不可用。
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/SessionListOK'

  /account/sessions/revoke:
    post:
      tags: [Account]
      operationId: revokeSession
      summary: 踢出指定会话
      description: |
        撤销本人指定的会话；sessionId 非数字返回 1001，会话不存在或不属于本人返回 1004。
        错误码：1001 参数错误、1002 未认证或登录态已失效、1004 资源不存在、
        9001 服务内部错误、9002 依赖服务不可用。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevokeSessionRequest'
      responses:
        '200':
          $ref: '#/components/responses/EmptyOK'

  /account/password:
    put:
      tags: [Account]
      operationId: changePassword
      summary: 修改密码
      description: |
        校验原密码后更新密码，并撤销除当前会话外的全部会话。
        原密码错误返回 2002；新密码不满足复杂度返回 1001。
        错误码：1001 参数错误、1002 未认证或登录态已失效、2002 账号或密码错误、
        9001 服务内部错误、9002 依赖服务不可用。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          $ref: '#/components/responses/EmptyOK'

  /account:
    delete:
      tags: [Account]
      operationId: deleteAccount
      summary: 注销账号
      description: |
        立即下线当前账号并同步 IM：撤销全部会话、清除 Redis 活跃标记与 IM token 缓存。
        账号进入注销中（冷却期默认 15 天），冷却期内不可登录、不可调用业务接口，公开资料不可见。
        冷却期结束后由后台任务物理清除本地敏感数据（资料、凭证、会话、设备）并回收文件对象。
        重复调用幂等，返回相同的 purgeAt。
        错误码：1002 未认证或登录态已失效、2003 账号已被冻结、1004 资源不存在、
        1007 资源冲突、9001 服务内部错误、9002 依赖服务不可用。
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/DeleteAccountOK'

  /im/token:
    post:
      tags: [IM]
      operationId: exchangeIMToken
      summary: 兑换 IM token
      description: |
        请求体为空，平台取自 access token 的 claims（客户端无法改写）。
        IM 未启用或账号尚未开通完成返回 9002；平台非法返回 1001。
        服务端按 (userId, platformId) 缓存 IM token，命中时直接返回；未命中时才向 IM 兑换。
        受 IP 维度限流保护（默认 30 次/分钟），超限返回 1029。
        错误码：1001 参数错误、1002 未认证或登录态已失效、1004 资源不存在、2003 账号已被冻结、
        1029 请求过于频繁、9001 服务内部错误、9002 依赖服务不可用。
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/IMTokenOK'

  /im/status:
    get:
      tags: [IM]
      operationId: getIMStatus
      summary: 查询 IM 开通状态
      description: |
        返回当前账号的 IM 开通状态：0 待开通、1 已开通、2 失败；syncedAt 为最近一次开通成功时间。
        错误码：1002 未认证或登录态已失效、1004 资源不存在、9001 服务内部错误、9002 依赖服务不可用。
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/IMStatusOK'

  /im/retry:
    post:
      tags: [IM]
      operationId: retryIMProvision
      summary: 重试 IM 账号开通
      description: |
        重新调用 IM 开通接口，然后返回与 /im/status 相同的结构；已开通的账号重复调用不会重复注册。
        受 IP 维度限流保护（默认 30 次/分钟），超限返回 1029。
        错误码：1002 未认证或登录态已失效、1004 资源不存在、1029 请求过于频繁、
        9001 服务内部错误、9002 依赖服务不可用。
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/IMStatusOK'

  /profile/me:
    get:
      tags: [Profile]
      operationId: getMyProfile
      summary: 查询本人资料
      description: |
        返回当前用户的完整资料：登录名、昵称、头像 key/URL 与签名。
        `avatarUrl` 是稳定公开地址，客户端直接渲染；为空表示未设置头像。
        错误码：1002 未认证或登录态已失效、1004 资源不存在、9001 服务内部错误、9002 依赖服务不可用。
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/ProfileOK'
    put:
      tags: [Profile]
      operationId: updateMyProfile
      summary: 更新本人资料
      description: |
        只更新请求体中出现的字段，未出现的字段保持不变；三个字段全部缺省返回 1001。
        昵称不能为空；头像 key 与签名传空字符串表示清空。
        `avatarKey` 传 `/files/presign` 或 complete 返回的 `objectKey`，服务端会解析为公开 `avatarUrl`。
        资料变更与 IM 同步任务在同一事务提交，提交后若 IM 已开通则即时同步 goim；
        IM 未开通时任务退避重试，开通完成后自动补齐。
        错误码：1001 参数错误、1002 未认证或登录态已失效、1004 资源不存在、9001 服务内部错误、9002 依赖服务不可用。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          $ref: '#/components/responses/ProfileOK'

  /profile/batch:
    post:
      tags: [Profile]
      operationId: batchProfiles
      summary: 批量查询公开资料
      description: |
        按 userId 批量返回公开资料（昵称、头像 key 与公开 avatarUrl），单次最多 100 个；
        不存在的用户直接跳过，不报错。userId 非数字返回 1001。
        错误码：1001 参数错误、1002 未认证或登录态已失效、9001 服务内部错误、9002 依赖服务不可用。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchProfilesRequest'
      responses:
        '200':
          $ref: '#/components/responses/ProfileListOK'

  /profile/users/{userId}:
    get:
      tags: [Profile]
      operationId: getPublicProfile
      summary: 查询指定用户公开资料
      description: |
        返回指定用户的昵称与头像 key；userId 非数字返回 1001，用户不存在返回 1004。
        错误码：1001 参数错误、1002 未认证或登录态已失效、1004 资源不存在、9001 服务内部错误、9002 依赖服务不可用。
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          description: 用户 ID（十进制数字字符串）。
          schema:
            type: string
          example: "123456789"
      responses:
        '200':
          $ref: '#/components/responses/PublicProfileOK'

  /devices:
    get:
      tags: [Device]
      operationId: listDevices
      summary: 我的设备列表
      description: |
        设备随注册/登录自动登记；返回当前用户已登记设备，按最近活跃时间倒序，不含推送 token。
        错误码：1002 未认证或登录态已失效、9001 服务内部错误、9002 依赖服务不可用。
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/DeviceListOK'

  /devices/{deviceId}:
    delete:
      tags: [Device]
      operationId: removeDevice
      summary: 移除设备
      description: |
        删除设备记录并撤销该设备的全部活跃会话；设备与同名设备会话都不存在时返回 1004。
        错误码：1001 参数错误、1002 未认证或登录态已失效、1004 资源不存在、
        9001 服务内部错误、9002 依赖服务不可用。
      security:
        - bearerAuth: []
      parameters:
        - name: deviceId
          in: path
          required: true
          description: 客户端上报的设备标识，1-64 个字符。
          schema:
            type: string
          example: web-device-001
      responses:
        '200':
          $ref: '#/components/responses/EmptyOK'

  /client-config:
    get:
      tags: [ClientConfig]
      operationId: getClientConfig
      summary: 获取客户端配置
      description: |
        公开接口。按 platform 读取配置（缺省 Web=5，取值同 X-Client-Platform），
        返回 configVersion 与 ETag；携带 If-None-Match 且命中时返回 304 且无响应体。
        配置表缺失时回退内置默认值。
        错误码：1001 参数错误、9001 服务内部错误、9002 依赖服务不可用（仍为 HTTP 200）。
      parameters:
        - name: platform
          in: query
          required: false
          description: 客户端平台，支持 ios / android / windows / macos / web / harmony 或数字 1/2/3/4/5/11；缺省 web。
          schema:
            type: string
            default: web
          example: 5
      responses:
        '200':
          $ref: '#/components/responses/ClientConfigOK'
        '304':
          $ref: '#/components/responses/NotModified'

  /client-config/schema:
    get:
      tags: [ClientConfig]
      operationId: getClientConfigSchema
      summary: 配置项元数据
      description: 返回可配置项的类型、默认值与适用范围，供客户端渲染设置页与校验输入。
      responses:
        '200':
          $ref: '#/components/responses/ClientConfigSchemaOK'

  /files/presign:
    post:
      tags: [File]
      operationId: presignFileUpload
      summary: 申请文件直传
      description: |
        校验 purpose / mime / size 后生成服务端对象键与 PUT 预签名 URL，记录以 pending 状态落库。
        客户端按返回的 method、uploadUrl 与 headers 直接上传对象字节，服务端不代理文件内容。
        支持头像、聊天图片、聊天文件与单文件附件：purpose=avatar（size ≤ 5MB）；
        purpose=chat_image（size ≤ 8MB，仅图片）；purpose=chat_file（size ≤ 8MB，超过 8MB
        改用 `/files/multipart/presign`）；purpose=attachment（size ≤ 8MB，超过 8MB 同样走分片）。
        avatar 是公开用途，对象 key 固定落在 `public/` 命名空间；
        chat_image、chat_file 必须传 `conversationId`，对象落在私有命名空间，仅会话成员可访问；
        attachment 为本人私有资源，也必须不传 `conversationId`。客户端不能指定对象键或公开标志。
        `conversationId` 规则：单聊为 `si_<id1>_<id2>`（会话 ID 由 goim 权威生成，服务端只校验格式、原样保存不重排，上传者必须是一端）；
        群聊为 `g_<groupID>` 或 `sg_<groupID>`，上传者必须是群成员（依赖 IM，不可用时返回 9002）。
        pending 记录 24 小时未完成时由清理任务回收。
        错误码：1001 参数错误（含会话缺失、格式非法、非群成员）、1002 未认证或登录态已失效、
        9001 服务内部错误、9002 依赖服务不可用（对象存储未配置或群成员查询失败时同样返回 9002）。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FilePresignRequest'
      responses:
        '200':
          $ref: '#/components/responses/FilePresignOK'

  /files/multipart/presign:
    post:
      tags: [File]
      operationId: presignMultipartUpload
      summary: 申请分片上传
      description: |
        仅 attachment 与 chat_file 用途支持，适用于 8MB 以上、200MB 以内的文件。
        chat_file 必须传 `conversationId`，规则与 `/files/presign` 相同；attachment 必须不传。
        服务端初始化 S3 Multipart 上传并一次返回全部分片预签名 URL；客户端逐片 PUT 后调用 complete。
        分片大小 8MB，分片数上限 100；分片签名默认 2 小时（storage.multipart_presign_expire），
        过期后可调用 /files/{fileId}/multipart/parts 刷新；pending 记录 24 小时未完成时由清理任务回收。
        错误码：1001 参数错误（用途/MIME/大小/会话不合法、非群成员）、1002 未认证或登录态已失效、
        9001 服务内部错误、9002 依赖服务不可用（含群成员查询失败）。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MultipartPresignRequest'
      responses:
        '200':
          $ref: '#/components/responses/MultipartPresignOK'

  /files/{fileId}/multipart/complete:
    post:
      tags: [File]
      operationId: completeMultipartUpload
      summary: 完成分片上传
      description: |
        校验分片数量与顺序后合并分片，并再次 HeadObject 校验总大小与 Content-Type，通过后置为 ready。
        分片 ETag 取每片 PUT 响应头 ETag 原值；重复完成已 ready 的文件幂等返回。
        错误码：1001 参数错误（分片缺失/顺序错误/对象校验失败）、1002 未认证或登录态已失效、
        1004 资源不存在、1005 状态冲突、9001 服务内部错误、9002 依赖服务不可用。
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FileID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MultipartCompleteRequest'
      responses:
        '200':
          $ref: '#/components/responses/FileOK'

  /files/{fileId}/multipart/abort:
    post:
      tags: [File]
      operationId: abortMultipartUpload
      summary: 取消分片上传
      description: |
        放弃未完成的分片上传并软删记录；已 ready 的文件不允许取消。
        错误码：1001 参数错误、1002 未认证或登录态已失效、
        1004 资源不存在、1005 状态冲突、9001 服务内部错误。
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FileID'
      responses:
        '200':
          $ref: '#/components/responses/EmptyOK'

  /files/{fileId}/multipart/parts:
    post:
      tags: [File]
      operationId: refreshMultipartPartURLs
      summary: 刷新分片上传签名
      description: |
        为未完成的分片上传重新签发分片 PUT URL；复用原 uploadId 与 objectKey，不产生新记录，
        已上传分片保持不变。partNumbers 为空表示刷新全部分片；分片号必须严格递增且不超过 partCount。
        分片签名有效期由 storage.multipart_presign_expire 控制（默认 2 小时），单文件与 GET 仍为 15 分钟。
        已 ready 的文件返回 1005，他人或已删除文件返回 1004。
        错误码：1001 参数错误（分片号非法/不支持分片）、1002 未认证或登录态已失效、
        1004 资源不存在、1005 状态冲突、9001 服务内部错误、9002 依赖服务不可用。
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FileID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MultipartPartsRequest'
      responses:
        '200':
          $ref: '#/components/responses/MultipartPresignOK'

  /files/{fileId}/complete:
    post:
      tags: [File]
      operationId: completeFileUpload
      summary: 完成上传校验
      description: |
        读取对象存储元数据，校验对象存在、实际大小 ≤ 用途上限且 Content-Type 与申请一致，
        通过后把记录从 pending 置为 ready；重复调用已 ready 的文件幂等返回。
        仅 avatar 在返回的 FileView 中带稳定公开 `url`，可直接作为头像地址；
        chat_image、chat_file、attachment 的 `url` 为空，需再调用 `/files/{fileId}/url` 现签。
        错误码：1001 参数错误（含对象未上传、大小或类型不符）、1002 未认证或登录态已失效、
        1004 资源不存在、1005 状态冲突、9001 服务内部错误、9002 依赖服务不可用。
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FileID'
      responses:
        '200':
          $ref: '#/components/responses/FileOK'

  /files/{fileId}/url:
    get:
      tags: [File]
      operationId: getFileURL
      summary: 获取文件访问地址
      description: |
        为已就绪的文件换取短时预签名 GET URL（默认 15 分钟）。
        avatar 允许任何登录用户换取；
        chat_image/chat_file 仅会话成员可换取：单聊为两端用户，群聊为当前群成员（依赖 IM，不可用时返回 9002）；
        attachment 仅限本人。无权限、他人或已删除文件统一返回 1004，避免暴露资源存在性。
        聊天资源每次渲染都应调用本接口换取新地址，不要缓存或写入消息体。
        错误码：1001 参数错误（文件未就绪）、1002 未认证或登录态已失效、
        1004 资源不存在或无权限、9001 服务内部错误、9002 依赖服务不可用（含群成员查询失败）。
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FileID'
      responses:
        '200':
          $ref: '#/components/responses/FileURLOK'

  /files/{fileId}:
    delete:
      tags: [File]
      operationId: deleteFile
      summary: 删除文件
      description: |
        软删本人文件并尽力删除对象存储对象；重复删除幂等。
        对象删除失败只记录日志，由清理任务按 deleted 状态回收。
        错误码：1001 参数错误、1002 未认证或登录态已失效、
        1004 资源不存在、1005 状态冲突、9001 服务内部错误、9002 依赖服务不可用。
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FileID'
      responses:
        '200':
          $ref: '#/components/responses/EmptyOK'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "登录/注册/刷新签发的 access token，通过 Authorization: Bearer <token> 传递。"

  parameters:
    XClientPlatform:
      name: X-Client-Platform
      in: header
      required: false
      description: |
        客户端平台。缺省按 Web（平台 ID 5）处理。
        支持字符串 ios / android / windows / macos / web / harmony，或数字 1 / 2 / 3 / 4 / 5 / 11；
        非法取值返回 1001。该值只影响新会话记录的 platform 字段。
      schema:
        type: string
        enum: ["ios", "android", "windows", "macos", "web", "harmony", "1", "2", "3", "4", "5", "11"]
        default: web
        example: web

    XDeviceID:
      name: X-Device-Id
      in: header
      required: true
      description: 客户端设备标识，1-64 个字符；登录/注册必填，缺失或超长返回 1001。
      schema:
        type: string
        minLength: 1
        maxLength: 64
      example: web-device-001

    FileID:
      name: fileId
      in: path
      required: true
      description: 申请上传时返回的文件 ID（十进制数字字符串）。
      schema:
        type: string
        pattern: '^[1-9][0-9]*$'
      example: "18"

    XClientVersion:
      name: X-Client-Version
      in: header
      required: false
      description: 客户端版本号，最长 32 个字符；可选，仅用于设备登记与观测，缺失按空值处理。
      schema:
        type: string
        maxLength: 32
      example: 1.0.0

  headers:
    XRequestID:
      description: 本次请求的追踪 ID；请求未携带 X-Request-ID 时由服务端生成 UUIDv7 并回写。
      required: false
      schema:
        type: string
        example: "0190f7a2-6d0e-7c1b-8f58-0e8f0d9c1234"

  responses:
    AuthOK:
      description: |
        成功时 data 为 AuthResponse（code=0）；
        业务失败时 HTTP 状态仍为 200，body 为 ErrorResponse。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/AuthResult'
              - $ref: '#/components/schemas/ErrorResponse'

    SessionListOK:
      description: |
        成功时 data 为 SessionView 数组（code=0）；
        业务失败时 HTTP 状态仍为 200，body 为 ErrorResponse。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/SessionListResult'
              - $ref: '#/components/schemas/ErrorResponse'

    EmptyOK:
      description: |
        成功时 code=0，data 为 null 或被省略；
        业务失败时 HTTP 状态仍为 200，body 为 ErrorResponse。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/EmptyResult'
              - $ref: '#/components/schemas/ErrorResponse'

    DeleteAccountOK:
      description: |
        成功时 data 为 DeleteAccountResponse（code=0）；
        业务失败时 HTTP 状态仍为 200，body 为 ErrorResponse。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/DeleteAccountResult'
              - $ref: '#/components/schemas/ErrorResponse'

    IMTokenOK:
      description: |
        成功时 data 为 IMTokenResponse（code=0）；
        业务失败时 HTTP 状态仍为 200，body 为 ErrorResponse。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/IMTokenResult'
              - $ref: '#/components/schemas/ErrorResponse'

    IMStatusOK:
      description: |
        成功时 data 为 IMStatusResponse（code=0）；
        业务失败时 HTTP 状态仍为 200，body 为 ErrorResponse。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/IMStatusResult'
              - $ref: '#/components/schemas/ErrorResponse'

    ProfileOK:
      description: |
        成功时 data 为 ProfileView（code=0）；
        业务失败时 HTTP 状态仍为 200，body 为 ErrorResponse。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/ProfileResult'
              - $ref: '#/components/schemas/ErrorResponse'

    ProfileListOK:
      description: |
        成功时 data 为 PublicProfileView 数组（code=0），不存在的用户不出现在结果中；
        业务失败时 HTTP 状态仍为 200，body 为 ErrorResponse。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/ProfileListResult'
              - $ref: '#/components/schemas/ErrorResponse'

    PublicProfileOK:
      description: |
        成功时 data 为 PublicProfileView（code=0）；
        业务失败时 HTTP 状态仍为 200，body 为 ErrorResponse。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/PublicProfileResult'
              - $ref: '#/components/schemas/ErrorResponse'

    DeviceListOK:
      description: |
        成功时 data 为 DeviceView 数组（code=0）；
        业务失败时 HTTP 状态仍为 200，body 为 ErrorResponse。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/DeviceListResult'
              - $ref: '#/components/schemas/ErrorResponse'

    ClientConfigOK:
      description: |
        成功时 data 为 ClientConfigResponse（code=0），并返回 ETag；
        业务失败时 HTTP 状态仍为 200，body 为 ErrorResponse。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
        ETag:
          description: 当前配置的强 ETag，格式为 "cfg-<platform>-<version>"。
          schema:
            type: string
          example: '"cfg-5-1"'
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/ClientConfigResult'
              - $ref: '#/components/schemas/ErrorResponse'

    ClientConfigSchemaOK:
      description: |
        成功时 data 为 ClientConfigSchemaResponse（code=0）；
        业务失败时 HTTP 状态仍为 200，body 为 ErrorResponse。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/ClientConfigSchemaResult'
              - $ref: '#/components/schemas/ErrorResponse'

    NotModified:
      description: If-None-Match 命中当前 ETag，配置未变化，响应无 body。
      headers:
        ETag:
          description: 当前配置的强 ETag。
          schema:
            type: string
          example: '"cfg-5-1"'
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'

    FilePresignOK:
      description: |
        成功时 data 为 FilePresignResponse（code=0）；
        业务失败时 HTTP 状态仍为 200，body 为 ErrorResponse。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/FilePresignResult'
              - $ref: '#/components/schemas/ErrorResponse'

    MultipartPresignOK:
      description: |
        成功时 data 为 MultipartPresignResponse（code=0）；
        业务失败时 HTTP 状态仍为 200，body 为 ErrorResponse。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/MultipartPresignResult'
              - $ref: '#/components/schemas/ErrorResponse'

    FileOK:
      description: |
        成功时 data 为 FileView（code=0）；
        业务失败时 HTTP 状态仍为 200，body 为 ErrorResponse。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/FileResult'
              - $ref: '#/components/schemas/ErrorResponse'

    FileURLOK:
      description: |
        成功时 data 为 FileURLResponse（code=0）；
        业务失败时 HTTP 状态仍为 200，body 为 ErrorResponse。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/FileURLResult'
              - $ref: '#/components/schemas/ErrorResponse'

  schemas:
    RegisterRequest:
      type: object
      description: 注册请求；设备标识与版本通过 X-Device-Id / X-Client-Version 请求头传入。
      required: [loginName, password]
      properties:
        loginName:
          type: string
          description: 登录名；服务端归一化为小写，仅允许 3-64 位字母、数字、下划线。
          minLength: 3
          maxLength: 64
          example: alice
        password:
          type: string
          description: 明文密码；8-64 字节且同时包含字母与数字。
          minLength: 8
          maxLength: 64
          example: Passw0rd!
        nickname:
          type: string
          description: 昵称；最长 64 个字符，为空时回退为登录名。
          maxLength: 64
          example: Alice
      example:
        loginName: alice
        password: Passw0rd!
        nickname: Alice

    LoginRequest:
      type: object
      description: 登录请求；设备标识与版本通过 X-Device-Id / X-Client-Version 请求头传入。
      required: [loginName, password]
      properties:
        loginName:
          type: string
          description: 登录名；服务端会去空格并转小写。
          maxLength: 64
          example: alice
        password:
          type: string
          description: 明文密码。
          maxLength: 64
          example: Passw0rd!
      example:
        loginName: alice
        password: Passw0rd!

    RefreshRequest:
      type: object
      description: 刷新令牌请求；空 refreshToken 返回 1002。
      properties:
        refreshToken:
          type: string
          description: 登录/注册/上次刷新返回的 refreshToken。
          example: "rt_7d3c9f1a2b4e6d8f"
      example:
        refreshToken: "rt_7d3c9f1a2b4e6d8f"

    RevokeSessionRequest:
      type: object
      description: 撤销指定会话请求。
      required: [sessionId]
      properties:
        sessionId:
          type: string
          description: 会话 ID（十进制数字字符串）；非数字返回 1001。
          example: "123456789"
      example:
        sessionId: "123456789"

    ChangePasswordRequest:
      type: object
      description: 修改密码请求。
      required: [oldPassword, newPassword]
      properties:
        oldPassword:
          type: string
          description: 原密码。
          maxLength: 64
          example: Passw0rd!
        newPassword:
          type: string
          description: 新密码；8-64 字节且同时包含字母与数字。
          minLength: 8
          maxLength: 64
          example: NewPassw0rd!
      example:
        oldPassword: Passw0rd!
        newPassword: NewPassw0rd!

    DeleteAccountResponse:
      type: object
      description: 注销申请成功后的 data。
      required: [purgeAt]
      properties:
        purgeAt:
          type: string
          format: date-time
          description: 冷却期结束后的物理清除时间（UTC）；同一账号重复注销返回同一时间。
          example: "2026-12-03T10:00:00Z"

    AuthResponse:
      type: object
      description: 注册/登录/刷新成功后的 data。
      required: [user, token, refreshExpiresIn, sessionId, platform]
      properties:
        user:
          $ref: '#/components/schemas/UserView'
        token:
          $ref: '#/components/schemas/TokenView'
        refreshToken:
          type: string
          description: 刷新令牌；authResp 始终写入，DTO 中带 omitempty。
          example: "rt_7d3c9f1a2b4e6d8f"
        refreshExpiresIn:
          type: integer
          format: int64
          description: refresh token 有效期（秒）。
          example: 2592000
        sessionId:
          type: string
          description: 新创建的会话 ID（十进制数字字符串）。
          example: "123456789"
        platform:
          type: integer
          format: int32
          description: 平台 ID：iOS=1、Android=2、Windows=3、macOS=4、Web=5、HarmonyOS=11。
          enum: [1, 2, 3, 4, 5, 11]
          example: 5

    UserView:
      type: object
      description: 账号基础信息。
      required: [userId, loginName, nickname]
      properties:
        userId:
          type: string
          description: 用户 ID（十进制数字字符串），与 IM userID 一致。
          example: "123456789"
        loginName:
          type: string
          example: alice
        nickname:
          type: string
          example: Alice

    TokenView:
      type: object
      description: 本次签发的访问令牌。
      required: [accessToken, expiresIn]
      properties:
        accessToken:
          type: string
          description: "access JWT，用于 Authorization: Bearer <token>。"
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.example.payload.signature"
        expiresIn:
          type: integer
          format: int64
          description: access token 有效期（秒）。
          example: 900

    SessionView:
      type: object
      description: 对外暴露的会话信息，不含任何令牌。
      required: [sessionId, platform, deviceId, userAgent, ip, createdAt, lastSeenAt, expiresAt, current]
      properties:
        sessionId:
          type: string
          description: 会话 ID（十进制数字字符串）。
          example: "123456789"
        platform:
          type: integer
          format: int32
          description: 平台 ID：iOS=1、Android=2、Windows=3、macOS=4、Web=5、HarmonyOS=11。
          enum: [1, 2, 3, 4, 5, 11]
          example: 5
        deviceId:
          type: string
          example: web-device-001
        userAgent:
          type: string
          example: Mozilla/5.0 (Windows NT 10.0; Win64; x64)
        ip:
          type: string
          example: "1.2.3.4"
        createdAt:
          type: string
          format: date-time
          example: "2026-11-14T10:00:00+08:00"
        lastSeenAt:
          type: string
          format: date-time
          nullable: true
          description: 最后活跃时间；当前实现不更新该字段，通常为 null。
          example: null
        expiresAt:
          type: string
          format: date-time
          example: "2026-12-14T10:00:00+08:00"
        current:
          type: boolean
          description: 是否为当前请求所在的会话。
          example: true

    SessionViewList:
      type: array
      description: 活跃会话列表。
      items:
        $ref: '#/components/schemas/SessionView'

    DeleteAccountResult:
      type: object
      description: 注销申请的成功响应体。
      required: [code, msg, data]
      properties:
        code:
          type: integer
          format: int32
          example: 0
        msg:
          type: string
          example: success
        data:
          $ref: '#/components/schemas/DeleteAccountResponse'

    AuthResult:
      type: object
      description: 注册/登录/刷新的成功响应体。
      required: [code, msg, data]
      properties:
        code:
          type: integer
          format: int32
          example: 0
        msg:
          type: string
          example: success
        data:
          $ref: '#/components/schemas/AuthResponse'

    SessionListResult:
      type: object
      description: 会话列表的成功响应体。
      required: [code, msg, data]
      properties:
        code:
          type: integer
          format: int32
          example: 0
        msg:
          type: string
          example: success
        data:
          $ref: '#/components/schemas/SessionViewList'

    EmptyResult:
      type: object
      description: 无业务数据的成功响应体。
      required: [code, msg]
      properties:
        code:
          type: integer
          format: int32
          example: 0
        msg:
          type: string
          example: success
        data:
          type: object
          nullable: true
          description: 成功时为 null 或被省略。

    IMTokenResponse:
      type: object
      description: IM token 兑换成功后的 data。
      required: [userId, token, expireTimeSeconds, apiBaseUrl, wsUrl, platformId]
      properties:
        userId:
          type: string
          description: 用户 ID（十进制数字字符串），同时就是 IM userID。
          example: "123456789"
        token:
          type: string
          description: IM 侧签发的 user token。
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.im-token.example"
        expireTimeSeconds:
          type: integer
          format: int64
          description: token 剩余有效期（秒），服务端已扣除缓存安全窗口。
          example: 86400
        apiBaseUrl:
          type: string
          description: 客户端访问 IM HTTP 接口的根地址。
          example: "https://im.example.com/api/v1"
        wsUrl:
          type: string
          description: 客户端连接 IM WebSocket 的地址；未配置时为空字符串。
          example: "wss://im.example.com/ws"
        platformId:
          type: integer
          format: int32
          description: 平台 ID：iOS=1、Android=2、Windows=3、macOS=4、Web=5、HarmonyOS=11。
          enum: [1, 2, 3, 4, 5, 11]
          example: 5

    IMStatusResponse:
      type: object
      description: IM 账号开通状态。
      required: [userId, status, syncedAt]
      properties:
        userId:
          type: string
          description: 用户 ID（十进制数字字符串），同时就是 IM userID。
          example: "123456789"
        status:
          type: integer
          format: int32
          description: 开通状态：0 待开通、1 已开通、2 失败。
          enum: [0, 1, 2]
          example: 1
        syncedAt:
          type: string
          format: date-time
          nullable: true
          description: 最近一次开通成功的时间；待开通或失败时为 null。
          example: "2026-11-16T10:00:00+08:00"

    IMTokenResult:
      type: object
      description: IM token 兑换的成功响应体。
      required: [code, msg, data]
      properties:
        code:
          type: integer
          format: int32
          example: 0
        msg:
          type: string
          example: success
        data:
          $ref: '#/components/schemas/IMTokenResponse'

    IMStatusResult:
      type: object
      description: IM 开通状态的成功响应体。
      required: [code, msg, data]
      properties:
        code:
          type: integer
          format: int32
          example: 0
        msg:
          type: string
          example: success
        data:
          $ref: '#/components/schemas/IMStatusResponse'

    ProfileView:
      type: object
      description: 当前用户的完整资料。
      required: [userId, loginName, nickname, avatarKey, avatarUrl, bio]
      properties:
        userId:
          type: string
          description: 用户 ID（十进制数字字符串）。
          example: "123456789"
        loginName:
          type: string
          example: alice
        nickname:
          type: string
          description: 昵称；最长 64 个字符，不会为空。
          example: Alice
        avatarKey:
          type: string
          description: |
            头像对象 key，用于更新资料时回传，不直接对外使用。
            为空表示未设置头像。
          example: "public/avatar/123/0198c2f0....png"
        avatarUrl:
          type: string
          format: uri
          description: |
            头像公开访问 URL，由 avatarKey 解析得到；为空表示未设置头像。
            该地址稳定不过期，任何人可直接 GET（仅 public/ 命名空间由部署侧开放匿名读）。
          example: "https://files.example.com/goim-business/public/avatar/123/0198c2f0....png"
        bio:
          type: string
          description: 个性签名；最长 255 个字符，为空表示未设置。
          example: 你好，世界

    PublicProfileView:
      type: object
      description: 他人可见的公开资料，不含登录名与签名。
      required: [userId, nickname, avatarKey, avatarUrl]
      properties:
        userId:
          type: string
          description: 用户 ID（十进制数字字符串）。
          example: "123456789"
        nickname:
          type: string
          example: Alice
        avatarKey:
          type: string
          description: 头像对象 key；为空表示未设置头像。
          example: "public/avatar/123/0198c2f0....png"
        avatarUrl:
          type: string
          format: uri
          description: |
            头像公开访问 URL；为空表示未设置头像。客户端直接渲染该地址，无需再换取签名 URL。
          example: "https://files.example.com/goim-business/public/avatar/123/0198c2f0....png"

    UpdateProfileRequest:
      type: object
      description: |
        更新资料请求；字段缺省表示不修改，三个字段全部缺省返回 1001。
        昵称不能为空，头像 key 与签名传空字符串表示清空。
      properties:
        nickname:
          type: string
          description: 昵称；最长 64 个字符，不能为空。
          maxLength: 64
          example: Alice
        avatarKey:
          type: string
          description: |
            头像对象 key，取 `/files/presign` 或 complete 返回的 `objectKey`；最长 255 个字符。
            服务端据此生成公开 `avatarUrl`，传空字符串表示清空头像。
          maxLength: 255
          example: "public/avatar/123/0198c2f0....png"
        bio:
          type: string
          description: 个性签名；最长 255 个字符。
          maxLength: 255
          example: 你好，世界
      example:
        nickname: Alice
        bio: 你好，世界

    BatchProfilesRequest:
      type: object
      description: 批量查询公开资料请求；不存在的用户会被跳过。
      required: [userIds]
      properties:
        userIds:
          type: array
          description: 用户 ID 列表（十进制数字字符串），1-100 个。
          minItems: 1
          maxItems: 100
          items:
            type: string
            example: "123456789"
      example:
        userIds: ["123456789", "987654321"]

    PublicProfileViewList:
      type: array
      description: 公开资料列表。
      items:
        $ref: '#/components/schemas/PublicProfileView'

    ProfileResult:
      type: object
      description: 本人资料查询/更新的成功响应体。
      required: [code, msg, data]
      properties:
        code:
          type: integer
          format: int32
          example: 0
        msg:
          type: string
          example: success
        data:
          $ref: '#/components/schemas/ProfileView'

    ProfileListResult:
      type: object
      description: 批量公开资料查询的成功响应体。
      required: [code, msg, data]
      properties:
        code:
          type: integer
          format: int32
          example: 0
        msg:
          type: string
          example: success
        data:
          $ref: '#/components/schemas/PublicProfileViewList'

    PublicProfileResult:
      type: object
      description: 单用户公开资料查询的成功响应体。
      required: [code, msg, data]
      properties:
        code:
          type: integer
          format: int32
          example: 0
        msg:
          type: string
          example: success
        data:
          $ref: '#/components/schemas/PublicProfileView'

    FilePresignRequest:
      type: object
      description: 申请文件直传；对象键由服务端生成，客户端不可指定。
      required: [purpose, mime, size]
      properties:
        purpose:
          type: string
          description: |
            文件用途；avatar 为头像（公开，落在 `public/` 命名空间）；
            chat_image 为聊天图片，chat_file 为聊天文件，二者必须绑定 `conversationId` 且仅会话成员可访问；
            attachment 为仅本人可读的业务附件。
          enum: [avatar, chat_image, chat_file, attachment]
          example: chat_image
        conversationId:
          type: string
          maxLength: 64
          description: |
            聊天资源绑定的会话标识：单聊 `si_<id1>_<id2>`，群聊 `g_<groupID>` 或 `sg_<groupID>`。
            chat_image/chat_file 必填；avatar/attachment 必须为空，传了返回 1001。
          example: si_123_456
        fileName:
          type: string
          maxLength: 255
          description: 客户端原始文件名，仅用于展示，不参与对象路径。
          example: me.png
        mime:
          type: string
          description: |
            文件类型；必须与实际上传的 Content-Type 一致。
            avatar 仅支持 JPEG/PNG/WebP；chat_image 仅支持 JPEG/PNG/WebP/GIF；
            chat_file 与 attachment 支持下方完整白名单（图片、音频、视频、文档）。
          enum:
            - "image/jpeg"
            - "image/png"
            - "image/webp"
            - "image/gif"
            - "audio/mpeg"
            - "audio/wav"
            - "audio/x-wav"
            - "audio/amr"
            - "audio/mp4"
            - "audio/x-m4a"
            - "audio/aac"
            - "application/pdf"
            - "application/zip"
            - "text/plain"
            - "video/mp4"
            - "application/vnd.openxmlformats-officedocument.wordprocessingml.document"
            - "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
            - "application/vnd.openxmlformats-officedocument.presentationml.presentation"
          example: image/png
        size:
          type: integer
          format: int64
          minimum: 1
          maximum: 8388608
          description: 文件字节数；avatar ≤ 5MB，chat_image ≤ 8MB，chat_file/attachment ≤ 8MB（超过 8MB 使用分片上传，最大 200MB）。
          example: 120000
        sha256:
          type: string
          pattern: '^[0-9a-fA-F]{64}$'
          description: 可选的文件 SHA-256 十六进制摘要。
          example: "9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08"

    FilePresignResponse:
      type: object
      description: 直传签名信息；客户端按键值直接请求对象存储。
      required: [fileId, objectKey, uploadUrl, method, expiresAt]
      properties:
        fileId:
          type: string
          example: "18"
        objectKey:
          type: string
          description: |
            bucket 内对象路径。仅 avatar 位于 `public/<purpose>/<ownerID>/`；
            chat_image/chat_file/attachment 位于 `<purpose>/<ownerID>/`，不可匿名读。
          example: chat_image/123/file_0198c2f0-6c1a-7b3e-9d4f-abcdef012345.jpg
        uploadUrl:
          type: string
          format: uri
          description: 预签名上传地址，有效期见 expiresAt。
          example: "https://files.example.com/goim-business/public/avatar/123/0198c2f0....png?X-Amz-Algorithm=..."
        method:
          type: string
          enum: [PUT]
          example: PUT
        headers:
          type: object
          additionalProperties:
            type: string
          description: 上传时必须携带的请求头（例如 Content-Type）。
          example: {"Content-Type": "image/png"}
        expiresAt:
          type: integer
          format: int64
          description: 预签名 URL 过期时间（Unix 秒）。
          example: 1763000600

    FilePresignResult:
      type: object
      required: [code, msg, data]
      properties:
        code:
          type: integer
          format: int32
          example: 0
        msg:
          type: string
          example: success
        data:
          $ref: '#/components/schemas/FilePresignResponse'

    FileView:
      type: object
      description: 文件元数据；状态 0 待上传、1 可用、2 已删除。
      required: [fileId, purpose, objectKey, mime, size, status, createdAt]
      properties:
        fileId:
          type: string
          example: "18"
        purpose:
          type: string
          example: avatar
        objectKey:
          type: string
          description: |
            bucket 内对象路径；仅 avatar 为 `public/<purpose>/...`，其余用途均为 `<purpose>/...`。
          example: public/avatar/123/file_0198c2f0-6c1a-7b3e-9d4f-abcdef012345.png
        mime:
          type: string
          example: image/png
        size:
          type: integer
          format: int64
          example: 120000
        sha256:
          type: string
          example: ""
        url:
          type: string
          description: |
            仅 avatar 在 ready 后的稳定访问地址，任何人可直接 GET；
            chat_image、chat_file、attachment 为空字符串，需调用 `GET /files/{fileId}/url` 现签，
            聊天资源按会话成员鉴权，不要缓存地址或写入消息体。
          example: "https://files.example.com/goim-business/public/avatar/123/0198c2f0....png"
        status:
          type: integer
          format: int32
          enum: [0, 1, 2]
          example: 1
        createdAt:
          type: string
          format: date-time
          example: "2026-11-17T10:00:00+08:00"

    FileResult:
      type: object
      required: [code, msg, data]
      properties:
        code:
          type: integer
          format: int32
          example: 0
        msg:
          type: string
          example: success
        data:
          $ref: '#/components/schemas/FileView'

    FileURLResponse:
      type: object
      description: 短时文件访问地址。
      required: [url, expiresAt]
      properties:
        url:
          type: string
          format: uri
          example: "https://files.example.com/goim-business/attachment/123/a.pdf?X-Amz-Signature=..."
        expiresAt:
          type: integer
          format: int64
          description: 访问地址过期时间（Unix 秒）。
          example: 1763000600

    FileURLResult:
      type: object
      required: [code, msg, data]
      properties:
        code:
          type: integer
          format: int32
          example: 0
        msg:
          type: string
          example: success
        data:
          $ref: '#/components/schemas/FileURLResponse'

    MultipartPresignRequest:
      type: object
      description: 申请分片上传；attachment（仅本人）与 chat_file（需绑定会话）用途支持，8MB < size ≤ 200MB。
      required: [purpose, mime, size]
      properties:
        purpose:
          type: string
          enum: [attachment, chat_file]
          example: chat_file
        conversationId:
          type: string
          maxLength: 64
          description: |
            会话标识；chat_file 必填（单聊 `si_<id1>_<id2>`，群聊 `g_<groupID>`/`sg_<groupID>`），
            attachment 必须为空。
          example: g_1001
        fileName:
          type: string
          maxLength: 255
          example: report.pdf
        mime:
          type: string
          description: 附件与聊天文件类型白名单（图片、音频、视频、文档）。
          enum:
            - "image/jpeg"
            - "image/png"
            - "image/webp"
            - "image/gif"
            - "audio/mpeg"
            - "audio/wav"
            - "audio/x-wav"
            - "audio/amr"
            - "audio/mp4"
            - "audio/x-m4a"
            - "audio/aac"
            - "application/pdf"
            - "application/zip"
            - "text/plain"
            - "video/mp4"
            - "application/vnd.openxmlformats-officedocument.wordprocessingml.document"
            - "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
            - "application/vnd.openxmlformats-officedocument.presentationml.presentation"
          example: application/pdf
        size:
          type: integer
          format: int64
          minimum: 8388609
          maximum: 209715200
          description: 文件总字节数；超过 8MB 才需要分片，最大 200MB（attachment 与 chat_file 相同）。
          example: 12582912
        sha256:
          type: string
          pattern: '^[0-9a-fA-F]{64}$'
          example: ""

    MultipartPartPresign:
      type: object
      required: [partNumber, url, expiresAt]
      properties:
        partNumber:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          example: 1
        url:
          type: string
          format: uri
          description: 分片 PUT 预签名地址。
          example: "https://files.example.com/goim-business/attachment/123/file_....pdf?partNumber=1&X-Amz-Signature=..."
        expiresAt:
          type: integer
          format: int64
          description: 预签名过期时间（Unix 秒）。
          example: 1763000600

    MultipartPartsRequest:
      type: object
      description: 刷新分片签名；不传 partNumbers 表示刷新全部分片。
      properties:
        partNumbers:
          type: array
          description: 需要刷新的分片号，必须严格递增且不超过 partCount。
          minItems: 1
          maxItems: 100
          items:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
          example: [1, 2]

    MultipartPresignResponse:
      type: object
      required: [fileId, objectKey, uploadId, partSize, partCount, parts, expiresAt]
      properties:
        fileId:
          type: string
          example: "21"
        objectKey:
          type: string
          example: attachment/123/file_0198c2f0-6c1a-7b3e-9d4f-abcdef012345.pdf
        uploadId:
          type: string
          description: S3 Multipart 上传 ID；complete/abort 由服务端按 fileId 查找，无需回传。
          example: "2~abc123..."
        partSize:
          type: integer
          format: int64
          example: 8388608
        partCount:
          type: integer
          format: int32
          example: 2
        parts:
          type: array
          items:
            $ref: '#/components/schemas/MultipartPartPresign'
        expiresAt:
          type: integer
          format: int64
          description: 全部分片 URL 的统一过期时间（Unix 秒）。
          example: 1763000600

    MultipartPresignResult:
      type: object
      required: [code, msg, data]
      properties:
        code:
          type: integer
          format: int32
          example: 0
        msg:
          type: string
          example: success
        data:
          $ref: '#/components/schemas/MultipartPresignResponse'

    MultipartCompletedPart:
      type: object
      required: [partNumber, etag]
      properties:
        partNumber:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          example: 1
        etag:
          type: string
          maxLength: 128
          description: 分片 PUT 响应头 ETag 的原值（通常带双引号）。
          example: "\"d41d8cd98f00b204e9800998ecf8427e\""

    MultipartCompleteRequest:
      type: object
      required: [parts]
      properties:
        parts:
          type: array
          minItems: 1
          maxItems: 100
          description: 必须与服务端返回的 partCount 一致，且 partNumber 从 1 连续递增。
          items:
            $ref: '#/components/schemas/MultipartCompletedPart'

    DeviceView:
      type: object
      description: 对外暴露的设备信息，不含推送 token。
      required: [deviceId, platform, appVersion, lastActiveAt]
      properties:
        deviceId:
          type: string
          example: web-device-001
        platform:
          type: integer
          format: int32
          description: 平台 ID：iOS=1、Android=2、Windows=3、macOS=4、Web=5、HarmonyOS=11。
          enum: [1, 2, 3, 4, 5, 11]
          example: 5
        appVersion:
          type: string
          example: 1.2.0
        lastActiveAt:
          type: string
          format: date-time
          example: "2026-11-17T10:00:00+08:00"

    DeviceViewList:
      type: array
      description: 设备列表。
      items:
        $ref: '#/components/schemas/DeviceView'

    DeviceListResult:
      type: object
      description: 设备列表查询的成功响应体。
      required: [code, msg, data]
      properties:
        code:
          type: integer
          format: int32
          example: 0
        msg:
          type: string
          example: success
        data:
          $ref: '#/components/schemas/DeviceViewList'

    ClientConfigResponse:
      type: object
      description: 客户端启动配置。
      required: [configVersion, features, im, limits, minAppVersion]
      properties:
        configVersion:
          type: integer
          format: int32
          description: 配置版本；版本变化后旧 ETag 不再命中。
          example: 1
        features:
          type: object
          description: 功能开关。
          additionalProperties:
            type: boolean
          example:
            voiceMessage: false
            fileUpload: true
        im:
          $ref: '#/components/schemas/ClientConfigIM'
        limits:
          type: object
          description: 客户端限制值。
          additionalProperties:
            type: integer
            format: int64
          example:
            maxUploadBytes: 104857600
            maxAvatarBytes: 5242880
        minAppVersion:
          type: object
          description: 各端最低版本要求。
          additionalProperties:
            type: string
          example:
            web: 1.0.0
            desktop: 1.0.0

    ClientConfigIM:
      type: object
      description: 配置中与 IM 连接相关的运行期信息。
      required: [apiBaseUrl, wsUrl, platformId]
      properties:
        apiBaseUrl:
          type: string
          description: 客户端访问 IM HTTP 接口的根地址；IM 未配置时为空字符串。
          example: "https://im.example.com/api/v1"
        wsUrl:
          type: string
          description: IM WebSocket 地址；未配置时为空字符串。
          example: "wss://im.example.com/ws"
        platformId:
          type: integer
          format: int32
          description: 请求时使用的平台 ID。
          enum: [1, 2, 3, 4, 5, 11]
          example: 5

    ClientConfigSchemaResponse:
      type: object
      description: 配置项元数据。
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ClientConfigItemSchema'

    ClientConfigItemSchema:
      type: object
      description: 单个配置项的类型、默认值与适用范围。
      required: [key, type, scope]
      properties:
        key:
          type: string
          description: 配置项路径，如 features.fileUpload。
          example: features.fileUpload
        type:
          type: string
          description: 值类型：bool / int64 / string。
          enum: [bool, int64, string]
          example: bool
        default:
          description: 默认值，类型由 type 决定（布尔、整数或字符串）。
          example: true
        scope:
          type: string
          description: 适用范围：all / web / desktop / runtime。
          example: all

    ClientConfigResult:
      type: object
      description: 客户端配置查询的成功响应体。
      required: [code, msg, data]
      properties:
        code:
          type: integer
          format: int32
          example: 0
        msg:
          type: string
          example: success
        data:
          $ref: '#/components/schemas/ClientConfigResponse'

    ClientConfigSchemaResult:
      type: object
      description: 配置项元数据的成功响应体。
      required: [code, msg, data]
      properties:
        code:
          type: integer
          format: int32
          example: 0
        msg:
          type: string
          example: success
        data:
          $ref: '#/components/schemas/ClientConfigSchemaResponse'

    ErrorResponse:
      type: object
      description: |
        统一业务错误响应体（HTTP 状态仍为 200）。
        code 取自 errcode：1001 参数错误、1002 未认证、1004 资源不存在、1029 限流、
        2001-2006 账号域错误、9001 内部错误、9002 依赖服务不可用。
      required: [code, msg]
      properties:
        code:
          type: integer
          format: int32
          description: 业务错误码，非 0。
          example: 1001
        msg:
          type: string
          description: 面向用户的错误提示。
          example: 参数错误
        data:
          type: object
          nullable: true
          additionalProperties: true
          description: 错误明细；参数校验失败时为字段与校验规则的映射，其余多为 null 或被省略。
          example: null
      example:
        code: 1001
        msg: 参数错误
        data:
          Password: min
